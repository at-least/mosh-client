# No system dependencies: the crate is pure Rust (RustCrypto AES/OCB3,
# miniz_oxide), so the matrix is just the two OSes conch ships on.
# is_emsgsize (src/session.rs) hard-codes per-OS errno values, so both
# must actually run the suite, not merely compile it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - run: cargo build --locked
      - run: cargo test --locked
      # the fuzz crate's harness drivers + seed reachability pin run on
      # stable too (the libfuzzer targets themselves are nightly-only)
      - run: cargo test --locked --manifest-path fuzz/Cargo.toml --tests
      - run: cargo clippy --all-targets --locked -- -D warnings

  # The libFuzzer bins are nightly-only and excluded from the stable
  # test run (test = false), so they'd rot against driver changes
  # without this compile check. Non-blocking: a broken fuzz build must
  # not fail the release gates.
  fuzz-build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target
      - run: cargo install cargo-fuzz --locked
      - run: cargo +nightly fuzz build
